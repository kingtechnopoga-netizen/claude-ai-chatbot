<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f1e1d" />
    <meta name="description" content="AI chatbot powered by Puter.js - chat with Claude, GPT, Gemini and more for free" />
    <title>Claudia AI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>
    <div class="app" id="app">
        <!-- Sidebar overlay (mobile) -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="brand" id="brand-btn" title="New chat">
                    <span class="brand-mark">✦</span>
                    <span class="brand-name">Claudia</span>
                </button>
                <button class="icon-btn sidebar-close" id="sidebar-close" title="Close sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <button class="new-chat-btn" id="new-chat-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                <span>New chat</span>
            </button>

            <div class="chat-list-wrap">
                <div class="chat-list-label">Recents</div>
                <div class="chat-list" id="chat-list"></div>
            </div>

            <div class="sidebar-footer">
                <button class="footer-btn" id="theme-toggle" title="Toggle theme">
                    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <span id="theme-label">Light mode</span>
                </button>
                <button class="footer-btn" id="clear-all-btn" title="Clear all chats">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
                    <span>Clear all</span>
                </button>
            </div>
        </aside>

        <!-- Main -->
        <main class="main">
            <header class="topbar">
                <button class="icon-btn" id="sidebar-open" title="Open sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>

                <div class="model-selector">
                    <button class="model-btn" id="model-btn">
                        <span id="model-label">Claude Sonnet 4</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                    <div class="model-menu" id="model-menu"></div>
                </div>

                <button class="icon-btn" id="mobile-new-chat" title="New chat">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                </button>
            </header>

            <!-- Welcome / empty state -->
            <section class="welcome" id="welcome">
                <div class="welcome-inner">
                    <div class="welcome-logo">✦</div>
                    <h1 class="welcome-title">How can I help you today?</h1>
                    <div class="suggestions">
                        <button class="suggestion" data-prompt="Explain quantum computing in simple terms with an everyday analogy.">
                            <span class="s-icon">💡</span>
                            <span class="s-text">Explain quantum computing simply</span>
                        </button>
                        <button class="suggestion" data-prompt="Write a short bedtime story about a curious fox who discovers a glowing forest.">
                            <span class="s-icon">✍️</span>
                            <span class="s-text">Write a short story</span>
                        </button>
                        <button class="suggestion" data-prompt="Help me plan a healthy weekly meal plan with a grocery list.">
                            <span class="s-icon">🥗</span>
                            <span class="s-text">Plan a healthy week of meals</span>
                        </button>
                        <button class="suggestion" data-prompt="Give me 5 creative app ideas that use AI in everyday life.">
                            <span class="s-icon">🚀</span>
                            <span class="s-text">Brainstorm app ideas</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Messages -->
            <section class="messages" id="messages"></section>

            <!-- Composer -->
            <footer class="composer-wrap">
                <div class="composer">
                    <div class="attachments" id="attachments"></div>
                    <div class="composer-row">
                        <button class="icon-btn composer-btn" id="attach-btn" title="Attach image">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                        </button>
                        <button class="icon-btn composer-btn" id="image-btn" title="Generate image">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        </button>
                        <textarea
                            id="input"
                            class="input"
                            rows="1"
                            placeholder="Reply to Claudia..."
                            autocomplete="off"
                            autocapitalize="sentences"
                            spellcheck="true"
                        ></textarea>
                        <button class="send-btn" id="send-btn" title="Send">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                        </button>
                    </div>
                    <div class="composer-hint">
                        <span id="mode-hint">Chat mode</span>
                        <span class="sep">·</span>
                        <span>Powered by <a href="https://puter.com" target="_blank" rel="noreferrer">Puter</a></span>
                    </div>
                </div>
                <input type="file" id="file-input" accept="image/*" hidden />
            </footer>
        </main>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
